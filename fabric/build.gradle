plugins {
    id "com.github.johnrengelman.shadow" version "7.1.2"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modRuntimeOnly ("net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}") {
        exclude module: "fabric-loader"
    }

    api "gg.cloaks:javaclient:${cosmetica_java_client_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }

    // bundle javaclient
    shadow "gg.cloaks:javaclient:${cosmetica_java_client_version}"
    // Not bundled with java 11+

    // Source: https://mvnrepository.com/artifact/javax.xml.bind/jaxb-api
    // Source: https://mvnrepository.com/artifact/javax.activation/javax.activation-api
    shadow "javax.xml.bind:jaxb-api:2.4.0-b180830.0359"
    shadow "javax.activation:javax.activation-api:1.2.0"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

shadowJar {
    exclude "architectury.common.json"

    relocate 'com.fasterxml.jackson', 'cc.cosmetica.com.fasterxml.jackson'
    relocate 'org.openapitools.jackson', 'cc.cosmetica.org.openapitools.jackson'
    relocate 'org.apache.hc', 'cc.cosmetica.org.apache.hc'
    relocate 'org.slf4j', 'cc.cosmetica.org.slf4j'
    exclude 'javax/**'
    exclude 'org/apache/commons/**'

    mergeServiceFiles()

    configurations = [project.configurations.shadowCommon, project.configurations.shadow]
    archiveClassifier = "dev-shadow"
}

remapJar {
    injectAccessWidener = true
    input.set shadowJar.archiveFile
    dependsOn shadowJar
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenFabric(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        if (System.getenv("COSMETICA_MAVEN_PASSWORD") != null) {
            maven {
                url = "https://maven.cloaks.gg/releases"
                credentials {
                    username = System.getenv("COSMETICA_MAVEN_USERNAME")
                    password = System.getenv("COSMETICA_MAVEN_PASSWORD")
                }
            }
        }
    }
}
